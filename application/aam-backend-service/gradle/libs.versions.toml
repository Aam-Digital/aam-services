# Central version catalog for the aam-backend-service Gradle build.
#
# Every version string in this build lives here so that Renovate's `gradle` manager picks
# them up natively, and so that artifacts which must move together share a single entry
# instead of relying on reviewers to keep duplicates in sync.
#
# Dependencies that carry no version are managed by the Spring Boot BOM and stay declared
# inline in build.gradle.kts — there is nothing here for Renovate to update.

[versions]
# --- build tooling ---
kotlin = "2.4.10"
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
sentryPlugin = "6.16.0"
ktlintPlugin = "14.2.0"
# ktlint and jacoco are tool versions consumed by the ktlint {} and jacoco {} blocks.
# Leaving them unset is not an option: Gradle 9.6.1 defaults to JaCoCo 0.8.14 and the
# ktlint plugin 14.2.0 defaults to ktlint 1.5.0, both older than what we run.
ktlint = "1.8.0"
jacoco = "0.8.15"

# --- runtime ---
# keycloak-admin-client follows its own release train, which stops at 26.0.x and does not
# track the Keycloak server version (26.4.7, pinned in the SPI module's pom.xml).
keycloakAdminClient = "26.0.11"
firebaseAdmin = "9.10.0"
postgresql = "42.7.13"

# --- test ---
cucumber = "7.34.6"
mockitoKotlin = "6.3.0"
junitJsonParams = "5.10.2-r0"
parsson = "1.1.9"
okhttp = "5.4.0"
testcontainers = "1.21.4"
# Supplies its own default Keycloak image, which is what the e2e suite runs against.
testcontainersKeycloak = "4.3.1"
swaggerRequestValidator = "3.0.0"

# --- security constraints (see the constraints block in build.gradle.kts) ---
commonsCompress = "1.28.0"
mime4jCore = "0.8.14"

[libraries]
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloakAdminClient" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit = { module = "io.cucumber:cucumber-junit", version.ref = "cucumber" }
cucumber-spring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
junit-json-params = { module = "net.joshka:junit-json-params", version.ref = "junitJsonParams" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
okhttp-client = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq", version.ref = "testcontainers" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainersKeycloak" }
swagger-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swaggerRequestValidator" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
mime4j-core = { module = "org.apache.james:apache-mime4j-core", version.ref = "mime4jCore" }

# Declared purely to give Renovate a datasource for the two tool versions above. Renovate
# resolves a [versions] entry through the [libraries]/[plugins] entry that references it, so
# an unreferenced version would never be updated. These are not added to any configuration.
jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
# All four Kotlin plugins share one version by construction — they must never diverge.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
sentry-jvm = { id = "io.sentry.jvm.gradle", version.ref = "sentryPlugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
