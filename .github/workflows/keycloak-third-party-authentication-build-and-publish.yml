name: keycloak-third-party-authentication-build-and-publish

# The module is a Keycloak extension: it is published as the jar attached to the GitHub release
# `keycloak-third-party-authentication/v<version>` (no container image), which keycloak-aam downloads.

on:
  pull_request:
    paths:
      - '.github/workflows/keycloak-third-party-authentication-build-and-publish.yml'
      - '.github/workflows/_module-release.yml'
      - 'application/keycloak-third-party-authentication/**'
  push:
    tags:
      - 'keycloak-third-party-authentication/**'
    branches:
      - main
    paths:
      - '.github/workflows/keycloak-third-party-authentication-build-and-publish.yml'
      - '.github/workflows/_module-release.yml'
      - 'application/keycloak-third-party-authentication/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The Dockerfile only builds the jar (`FROM scratch`), which is exported to ./build instead of pushed
      - name: Build jar
        uses: docker/build-push-action@v7
        with:
          context: ./application/keycloak-third-party-authentication
          outputs: type=local,dest=./build
          cache-from: type=gha,scope=keycloak-third-party-authentication
          cache-to: type=gha,mode=min,scope=keycloak-third-party-authentication,ignore-error=true
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-third-party-authentication.jar
          if-no-files-found: 'error'
          path: ./build/keycloak-third-party-authentication.jar

  publish:
    name: Publish keycloak-third-party-authentication Release
    # Only main pushes compute and create the next release; the tag push this job creates
    # re-triggers this workflow (building the jar again) but must not re-run this job.
    if: ${{ github.ref == 'refs/heads/main' }} # release
    needs:
      - build
    uses: ./.github/workflows/_module-release.yml
    permissions:
      contents: read
    with:
      module: keycloak-third-party-authentication
      # keycloak-aam downloads the jar from the release `keycloak-third-party-authentication/v<version>`
      version-prefix: v
      asset-artifact: keycloak-third-party-authentication.jar
    secrets:
      token: ${{ secrets.GH_TOKEN }}
