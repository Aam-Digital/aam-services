name: aam-backend-service-build-and-publish

on:
  pull_request:
    paths:
      - '.github/workflows/aam-backend-service-build-and-publish.yml'
      - '.github/workflows/_module-release.yml'
      - 'application/aam-backend-service/**'
  push:
    tags:
      - 'aam-backend-service/**'
    branches:
      - main
    paths:
      - '.github/workflows/aam-backend-service-build-and-publish.yml'
      - '.github/workflows/_module-release.yml'
      - 'application/aam-backend-service/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    defaults:
      run:
        working-directory: application/aam-backend-service
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 25
          cache: 'gradle'

      - name: Check code style (ktlint)
        # Runs before the tests so that a formatting problem fails fast. Locally,
        # `./gradlew ktlintFormat` fixes what this reports. The `publish` job needs this job,
        # so unformatted code cannot be released.
        run: |
          ./gradlew ktlintCheck --no-daemon

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_SECRET }}

      - name: Run Tests and generate Jacoco Test Report
        run: |
          ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: application/aam-backend-service/build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          # JaCoCo XML records paths relative to the source root
          # (com/aamdigital/...), so prefix them to make them repo-relative.
          add-prefix: application/aam-backend-service/src/main/kotlin

  # Version of the edge build of a push to main (see Aam-Digital/.github): `X.Y.Z-edge.N`, the last
  # `aam-backend-service/X.Y.Z` release with the patch number bumped, plus the commits since. No tag, no GitHub release.
  # Runs for every trigger (it is cheap), so that the jobs below never depend on a skipped job; only main uses it.
  edge-version:
    uses: Aam-Digital/.github/.github/workflows/edge-version.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read
    with:
      tag-prefix: aam-backend-service/

  # Tags and build settings of the image, by trigger:
  # - release tag `aam-backend-service/<version>` (created by the `publish` job): `<version>`, `stable`, `latest`
  # - push to main (edge build): `X.Y.Z-edge.N`, plus `edge` and `main` (until nothing follows `main` any more) if it is
  #   still the newest main commit
  # - pull request: `pr-<n>`, linux/amd64 only
  image-config:
    needs: edge-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      stable: ${{ steps.config.outputs.stable }}
      tags: ${{ steps.config.outputs.tags }}
      platforms: ${{ steps.config.outputs.platforms }}
      application-version: ${{ steps.config.outputs.application-version }}
    steps:
      - name: Determine image tags and platforms
        id: config
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EDGE_VERSION: ${{ needs.edge-version.outputs.version }}
          EDGE_IS_HEAD: ${{ needs.edge-version.outputs.is-head }}
        run: |
          version=""
          stable=false
          tags=""
          platforms=linux/amd64,linux/arm64
          # Baked into the image as sentry.release (see application.yaml) so error events are tagged with a
          # version: the released or edge version, else (PRs) the commit SHA (unique per build).
          application_version=$GITHUB_SHA
          case "$GITHUB_REF" in
            refs/tags/aam-backend-service/*)
              # `{{version}}`-style plain versions (e.g. `1.22.14`) like those of ndb-core, also for a rebuild
              # of an older `v`-prefixed tag
              version=${GITHUB_REF#refs/tags/aam-backend-service/}
              version=${version#v}
              stable=true
              application_version=$version
              ;;
            refs/heads/main)
              version=$EDGE_VERSION
              application_version=$EDGE_VERSION
              # an older run that finishes late must not move the moving tags back
              [ "$EDGE_IS_HEAD" != "true" ] || tags=edge,main
              ;;
            *)
              if [ -z "$PR_NUMBER" ]; then
                echo "::error::Unexpected trigger $GITHUB_EVENT_NAME on $GITHUB_REF"
                exit 1
              fi
              tags=pr-$PR_NUMBER
              # PR builds stay basic; release and main images are built for both platforms.
              platforms=linux/amd64
              ;;
          esac
          {
            echo "version=$version"
            echo "stable=$stable"
            echo "tags=$tags"
            echo "platforms=$platforms"
            echo "application-version=$application_version"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version stable=$stable tags=$tags platforms=$platforms application-version=$application_version"

  # Check names: `build / build (linux/amd64)`, `build / build (linux/arm64)` (not on PRs), `build / merge`
  build:
    needs: image-config
    # On main, a newer push cancels an older edge build, so that `edge` never moves back. Other builds get a group of
    # their own (no cancelling).
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'edge-build' || format('build-{0}', github.run_id) }}
      cancel-in-progress: true
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read
      packages: write
    secrets:
      # SENTRY_UPLOAD_SOURCES below lets the Gradle build inside the image upload this build's source bundle, so
      # Sentry can show our source code next to the stack trace frames (see the Dockerfile). Not for pull requests:
      # those images are never deployed, and forks cannot read the secret anyway. Keep this condition in sync with
      # SENTRY_UPLOAD_SOURCES: a build that is told to upload but gets no token fails on purpose, rather than
      # quietly skipping the upload.
      BUILD_SECRETS: ${{ github.event_name != 'pull_request' && format('sentry_auth_token={0}', secrets.SENTRY_TOKEN) || '' }}
    with:
      images: ghcr.io/aam-digital/aam-services
      context: application/aam-backend-service
      version: ${{ needs.image-config.outputs.version }}
      stable: ${{ needs.image-config.outputs.stable == 'true' }}
      tags: ${{ needs.image-config.outputs.tags }}
      platforms: ${{ needs.image-config.outputs.platforms }}
      build-args: |
        APPLICATION_VERSION=${{ needs.image-config.outputs.application-version }}
        SENTRY_UPLOAD_SOURCES=${{ github.event_name != 'pull_request' }}
      # PRs from forks cannot push; only check that the image builds
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # After a full release, the edge images (`*-edge.*`) of the finished cycle are no longer needed. The images `edge`,
  # `main`, `stable` and `latest` point to are kept.
  prune-edge-images:
    if: startsWith(github.ref, 'refs/tags/aam-backend-service/')
    needs: build
    uses: Aam-Digital/.github/.github/workflows/image-cleanup.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      actions: write
      packages: write
    with:
      packages: aam-services
      tags: "*-edge.*"

  publish:
    name: Publish aam-backend-service Release
    # Only main pushes compute and create the next release; the tag push this job creates
    # re-triggers this workflow (to build the version-tagged image in the build job above)
    # but must not re-run this job.
    if: ${{ github.ref == 'refs/heads/main' }} # release
    # `build` too: PR images are linux/amd64 only, so the main build is the first arm64 build of a change.
    # A release whose tag-push image build would fail on arm64 must not be created.
    needs:
      - test
      - build
    uses: ./.github/workflows/_module-release.yml
    permissions:
      contents: read
    with:
      module: aam-backend-service
    secrets:
      token: ${{ secrets.GH_TOKEN }}
