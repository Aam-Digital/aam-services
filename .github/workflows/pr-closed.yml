name: PR closed

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Deletes the `pr-<n>` image of the PR (built by aam-backend-service-build-and-publish.yml). The images of
  # earlier pushes to the PR are already deleted by the build when it replaces them.
  # Check name: `cleanup-image / cleanup`
  cleanup-image:
    # PRs from forks have no image (and their token cannot delete packages)
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: Aam-Digital/.github/.github/workflows/pr-image-cleanup.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      actions: write
      packages: write
    with:
      packages: aam-services
      build-workflows: aam-backend-service-build-and-publish.yml
